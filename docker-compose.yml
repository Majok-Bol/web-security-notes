services:
 web:
   build: .
   #builds an image using the Dockerfile in the current directory
   container_name: flask_app
   #human readable name for a container eg view logs
   #we run 
   #docker logs flask_app
   ports:
      #exposes web services to host machine at localhost:8000
     - "8000:8000"
   env_file:
     #loads environment variables from .env file
     - .env
   depends_on:
   #ensures db service starts before the web
   #doesnt wait to be ready,just starts after
   #controls start up order
     - db
 db:
 #Docker downloads postresql version 17
 #equivalent to docker pull postgresql:17
   image: postgres:17
   #names the container to postgres_db instead of autogenerated names
   container_name: flask_db
   environment:
   #creates:username=postgres
     POSTGRES_USER: ${POSTGRES_USER}
     #creates passowrd=password
     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
     #create database: eg flask_db
     #equivalent to
     #CREATE DATABASE flask_db;
     #CREATE USER postgres
     POSTGRES_DB: ${POSTGRES_DB}

   ports:
   #postgeSQL default port=5432
    - "5432:5432"
   volumes:
   #persistent data storage
     - postgres_data:/var/lib/postgresql/data
   healthcheck:
     test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
     interval: 5s
     timeout: 5s
     retries: 5
volumes:
 postgres_data: