{%extends 'base.html'%}
{%block title%}Create note{%endblock%}
    {%block content%}
    <h1>Create note page</h1>
    <form method="post">
      {{form.hidden_tag()}}
      <div><h1>{{form.title.label}}{{form.title()}}</h1></div>
      <div>
        <h2>{{form.body.label}}{{form.body()}}</h2>
      </div>
      <div><p>{{form.submit()}}</p></div>
    </form>

    <a href="{{url_for('home')}}">Home</a>
    <a href="{{url_for('dashboard')}}">Dashboard</a>
    {%endblock%}
