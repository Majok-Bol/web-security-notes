<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1>Login page</h1>

    <form method="post">
      {{form.hidden_tag()}}
      <div>
        <p>{{form.username.label}}{{form.username()}}</p>
        <p>{{form.password.label}}{{form.password()}}</p>
        <p>{{form.submit()}}</p>
      </div>
    </form>
    <a href="{{url_for('home')}}">Home</a>
</body>
</html>
